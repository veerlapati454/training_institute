<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STACKLY · Faculty Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    /* =========================================================
       STACKLY — Faculty Portal (Mentor Dashboard)
       Shares tokens with the Rider Portal so both feel like one
       product: #F6F2EA paper | #FFFFFF card | #FF7A59 amber | #16232C ink
       #0A1A26 indigo-deep | #2E8F79 green | #B03A2E danger
       ========================================================= */
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      background: #F6F2EA;
      color: #16232C;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --paper: #F6F2EA;
      --paper-deep: #EDE6D8;
      --card: #FFFFFF;
      --line: rgba(22,35,44,.13);
      --line-bright: rgba(22,35,44,.24);
      --ink: #16232C;
      --ink-soft: #5C6B70;
      --ink-faint: #8E9CA0;
      --ink-faintest: rgba(92,107,112,0.68);
      --amber: #FF7A59;
      --amber-deep: #E4553A;
      --amber-soft: #FFE3D9;
      --amber-glow: rgba(255,122,89,0.22);
      --indigo-deep: #0A1A26;
      --indigo: #122A3A;
      --indigo-mid: #1B3B4F;
      --green: #2E8F79;
      --green-bright: #226657;
      --green-soft: #DBF0EA;
      --danger: #B03A2E;
      --font-display: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(.19,1,.22,1);
      --radius-sm:6px;
      --radius-md:12px;
      --radius-lg:20px;
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }
    ::selection{ background:var(--amber); color:#FDFBF5; }
    .classification-bar {
      background: var(--indigo-deep); color: #EDE7D6;
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase; text-align: center;
      padding: 7px 10px; position: sticky; top: 0; z-index: 60;
    }
    .dashboard-root { display: flex; min-height: 100vh; width: 100%; max-width: 100vw; position:relative; }
    .dashboard-root::before{
      content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(circle at 18% 20%, rgba(255,122,89,0.05) 0%, transparent 55%),
                       radial-gradient(circle at 85% 80%, rgba(46,143,121,0.04) 0%, transparent 55%);
    }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(10,26,38,0.5);
      z-index: 40; display: none; backdrop-filter: blur(4px);
    }
    .sidebar-overlay.show { display: block; animation: fadeIn .25s var(--ease); }
    @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
    .sidebar {
      width: 264px; flex-shrink: 0; background: var(--card);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
      padding: 22px 16px 16px; position: fixed; left: 0; top: 32px;
      height: calc(100vh - 32px); overflow-y: auto; z-index: 30;
    }
    .sidebar-header { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; padding: 10px 4px; position: relative; }
    .brand { display: flex; align-items: center; justify-content: center; width: 100%; text-decoration: none; }
    .brand-logo { width: 170px; height: auto; max-height: 48px; object-fit: contain; display: block; filter: brightness(0) saturate(100%); opacity: .92; }
    .close-btn {
      display: none; background: none; border: none; color: var(--ink-soft);
      font-size: 15px; padding: 4px 8px; cursor:pointer;
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    }
    .unit-strip {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
      color: var(--green-bright); text-transform: uppercase; text-align: center;
      padding: 9px 6px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--green-soft);
    }
    .unit-strip::before {
      content: ''; width: 6px; height: 6px; background: var(--green-bright);
      border-radius: 50%; box-shadow: 0 0 8px rgba(46,143,121,0.3);
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sidebar-section-label {
      font-family:var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
      color: var(--ink-faintest); text-transform: uppercase; margin: 14px 8px 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      background: none; border: none; width: 100%;
      padding: 10px 12px; border-radius: var(--radius-sm);
      color: var(--ink-soft); font-size: 13.5px; font-weight: 400;
      text-align: left; transition: all .2s ease; position: relative; cursor:pointer;
      font-family: var(--font-body);
    }
    .nav-item:hover { background: var(--amber-soft); color: var(--ink); transform:translateX(2px); }
    .nav-item.nav-active { background: var(--amber-soft); color: var(--amber-deep); font-weight: 600; box-shadow: 0 0 0 1px rgba(255,122,89,0.28) inset; }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .nav-badge { margin-left: auto; background: var(--amber); color: #FDFBF5; font-family:var(--font-mono); font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 999px; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; margin-top: 16px; margin-bottom: 4px;
      border-radius: var(--radius-sm); background: var(--paper-deep); border: 1px solid var(--line);
    }
    .sidebar-user-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: var(--green-soft); color: var(--green-bright);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-display); font-size: 14px; font-weight: 600; text-transform: uppercase;
    }
    .sidebar-user-info { min-width: 0; flex: 1; }
    .sidebar-user-name { font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .sidebar-user-email { font-size: 11px; color: var(--ink-faintest); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-full-btn {
      margin-top: 8px; width: 100%; padding: 11px; border-radius: var(--radius-sm);
      background: rgba(176,58,46,0.05); border: 1px solid rgba(176,58,46,0.24);
      color: var(--danger); font-family:var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing:.06em; text-transform:uppercase;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s ease; text-decoration: none; cursor: pointer;
    }
    .logout-full-btn:hover { background: rgba(176,58,46,0.12); }
    .main-content { flex: 1; min-width: 0; max-width: 100%; display: flex; flex-direction: column; margin-left: 264px; position:relative; z-index:1; }
    .topbar {
      position: sticky; top: 32px; z-index: 25;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 24px;
      background: rgba(246,242,234,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      flex-wrap: nowrap; min-height: 62px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex-shrink: 1; }
    .hamburger {
      display: none; flex-direction: column; justify-content: center; gap: 4px;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--paper-deep); border: 1px solid var(--line);
      align-items: center; flex-shrink: 0; cursor:pointer;
    }
    .hamburger span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; }
    .page-title { min-width: 0; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
    .page-title h1 {
      font-family:var(--font-display); letter-spacing:.01em; font-size: 25px; font-weight: 500; margin: 0;
      color: var(--ink); white-space: nowrap;
    }
    .page-title p { font-size: 12px; color: var(--ink-soft); margin: 0; white-space: nowrap; font-family: var(--font-body); letter-spacing:.01em; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }
    .search-box { display: flex; align-items: center; gap: 6px; background: var(--paper-deep); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 10px; min-width: 0; }
    .search-box input { background: none; border: none; outline: none; color: var(--ink); font-size: 12px; width: 170px; max-width: 100%; min-width: 60px; font-family: var(--font-body); }
    .search-box input::placeholder { color: var(--ink-faintest); font-size: 11.5px; }
    .search-icon { font-size: 12px; opacity: 0.7; color: var(--ink-soft); }
    .icon-btn {
      position: relative; width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: var(--paper-deep); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      flex-shrink: 0; cursor:pointer; transition:all .2s ease; color: var(--ink-soft);
    }
    .icon-btn:hover{ border-color:var(--amber); transform:translateY(-1px); color: var(--amber-deep); }
    .notif-dot {
      position: absolute; top: 6px; right: 6px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--danger); border: 1.5px solid var(--paper-deep);
      animation: notifPulse 2.2s ease-in-out infinite;
    }
    @keyframes notifPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(176,58,46,.35); } 50%{ box-shadow:0 0 0 4px rgba(176,58,46,0); } }
    .topbar-user { position: relative; flex-shrink: 0; }
    .topbar-user-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--paper-deep); border: 1px solid var(--line);
      border-radius: 999px; padding: 3px 10px 3px 3px;
      transition: border-color .2s ease; cursor:pointer;
    }
    .topbar-user-btn:hover { border-color:var(--amber); }
    .topbar-user-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--green-bright); color: #FDFBF5;
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-display); font-size: 12px; font-weight: 600; text-transform: uppercase;
    }
    .topbar-user-name { font-size: 11.5px; font-weight: 500; color: var(--ink); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .topbar-user-caret { font-size: 9px; color: var(--ink-faintest); }
    .topbar-user-menu {
      position: absolute; top: calc(100% + 8px); right: 0; width: 220px;
      background: var(--card); border: 1px solid var(--line-bright);
      border-radius: 10px; padding: 8px;
      box-shadow: 0 18px 40px rgba(10,26,38,0.16);
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .2s var(--ease), transform .2s var(--ease), visibility .2s ease;
      z-index: 60;
    }
    .topbar-user.open .topbar-user-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .topbar-user-menu-email { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .topbar-user-menu-email .label { font-family:var(--font-mono); font-size: 9px; font-weight: 500; color: var(--ink-faintest); text-transform: uppercase; letter-spacing: .06em; }
    .topbar-user-menu-email .value { font-size: 11.5px; font-weight: 600; color: var(--ink); margin-top: 2px; word-break: break-all; }
    .topbar-user-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 8px 10px; border-radius: var(--radius-sm);
      background: none; border: none; text-align: left;
      font-size: 11.5px; font-weight: 500; color: var(--ink-soft);
      transition: background .15s ease, color .15s ease; cursor:pointer; font-family: var(--font-body);
    }
    .topbar-user-menu-item:hover { background: var(--amber-soft); color: var(--ink); }
    .topbar-user-menu-item.danger:hover { background: rgba(176,58,46,0.1); color: var(--danger); }

    .content-area { padding: 24px 28px 48px; min-width: 0; max-width: 100%; overflow-x: hidden; }
    .hero-banner {
      position: relative; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px;
      border: 1px solid var(--line-bright); min-height: 150px; display: flex; align-items: center;
      background: linear-gradient(180deg, #16332B, var(--indigo-deep));
    }
    .hero-banner::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--green), #7BD2BE, var(--amber));
    }
    .hero-banner-inner { padding: 26px 30px; max-width: 580px; }
    .hero-eyebrow { font-family:var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #7BD2BE; margin-bottom: 8px; }
    .hero-banner h2 { font-family:var(--font-display); font-size: 26px; font-weight: 500; margin-bottom: 8px; color: #F6F2EA; letter-spacing: -0.01em; }
    .hero-banner p { font-size: 13.5px; color: rgba(246,242,234,0.62); line-height: 1.6; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-md); padding: 18px 18px 16px; min-width: 0;
      transition: all .25s ease; box-shadow: 0 1px 2px rgba(10,26,38,0.04);
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) forwards;
    }
    .stat-card[data-aos] { opacity: 0; animation: none; }
    .stats-grid .stat-card:nth-child(1){ animation-delay:.03s; }
    .stats-grid .stat-card:nth-child(2){ animation-delay:.09s; }
    .stats-grid .stat-card:nth-child(3){ animation-delay:.15s; }
    .stats-grid .stat-card:nth-child(4){ animation-delay:.21s; }
    @keyframes cardPop{ to{ opacity:1; transform:translateY(0); } }
    .stat-card:hover { border-color:var(--green-bright); transform:translateY(-3px); box-shadow:0 10px 26px rgba(46,143,121,0.12); }
    .stat-accent { border-color:rgba(46,143,121,0.4); background:linear-gradient(145deg, var(--green-soft), var(--card) 70%); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .stat-icon { font-size: 16px; color: var(--green-bright); }
    .stat-delta { font-family:var(--font-mono); font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
    .stat-delta.up { color: var(--green-bright); background: rgba(46,143,121,0.14); }
    .stat-delta.warn { color: var(--danger); background: rgba(176,58,46,0.1); }
    .stat-value { font-family:var(--font-display); font-size: 28px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
    .stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 4px; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-bar { height: 5px; background: rgba(22,35,44,0.08); border-radius: 999px; margin-top: 12px; overflow: hidden; }
    .stat-bar-fill { height: 100%; width:0; background: linear-gradient(90deg, var(--green-bright), var(--green)); border-radius: 999px; transition: width 1.1s var(--ease) .3s; }
    .mid-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; min-width: 0;
      box-shadow: 0 1px 2px rgba(10,26,38,0.04);
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) .1s forwards;
    }
    .card[data-aos] { opacity: 0; animation: none; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .card-title { font-family:var(--font-display); letter-spacing:.01em; font-size: 18px; font-weight: 500; margin: 0; color: var(--ink); }
    .card-sub { font-size: 12px; color: var(--ink-soft); margin: 3px 0 0; font-family: var(--font-body); }
    .table-wrapper { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    .runs-table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .runs-table th {
      text-align: left; font-family:var(--font-mono); font-size: 9.5px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--ink-faintest);
      padding: 0 10px 10px; border-bottom: 1px solid var(--line);
    }
    .runs-table td { padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
    .runs-table tr:last-child td { border-bottom: none; }
    .runs-table tbody tr { transition: background .15s ease; cursor:pointer; }
    .runs-table tbody tr:hover { background: var(--amber-soft); }
    .t-name { font-weight: 600; font-family: var(--font-display); font-size: 15px; color: var(--ink); }
    .t-sub { font-size: 11.5px; color: var(--ink-faintest); margin-top: 2px; font-family: var(--font-body); }
    .type-col { color: var(--ink-soft); }
    .date-col { color: var(--ink-soft); white-space: nowrap; font-family: var(--font-body); font-size: 12px; }
    .budget-col { font-weight: 700; white-space: nowrap; font-family:var(--font-mono); font-size:12px; color: var(--amber-deep); }
    .region-tag { font-family:var(--font-mono); font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; text-transform: uppercase; }
    .status-badge { font-family:var(--font-mono); font-size: 10px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; text-transform:uppercase; letter-spacing:.02em; }
    .status-active { background: rgba(46,143,121,0.14); color: var(--green-bright); }
    .status-field { background: rgba(255,122,89,0.14); color: var(--amber-deep); }
    .status-complete { background: rgba(142,156,160,0.18); color: var(--ink-faint); }
    .status-review { background: rgba(176,58,46,0.12); color: var(--danger); }
    .status-gold { background: rgba(255,122,89,0.18); color: var(--amber-deep); }
    .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 100px; }
    .progress-bar { flex: 1; height: 6px; background: rgba(22,35,44,0.08); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width:0; background: linear-gradient(90deg, var(--green-bright), var(--green)); border-radius: 999px; transition:width 1s var(--ease) .2s; }
    .progress-pct { font-family:var(--font-mono); font-size: 11px; color: var(--ink-soft); flex-shrink: 0; }
    .activity-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; }
    .activity-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 6px; border-radius: var(--radius-sm); transition: background .15s ease; cursor:pointer; }
    .activity-item:hover { background: var(--amber-soft); }
    .act-icon { font-size: 15px; flex-shrink: 0; line-height: 1.4; color: var(--green-bright); width:18px; text-align:center; margin-top:1px; }
    .act-body { flex: 1; min-width: 0; }
    .act-text { font-size: 13px; margin: 0; line-height: 1.5; word-wrap: break-word; color: var(--ink); }
    .act-time { font-family:var(--font-mono); font-size: 10.5px; color: var(--ink-faintest); margin-top: 4px; display: block; }
    .team-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; }
    .team-item { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: var(--radius-sm); transition: background .15s ease; cursor:pointer; }
    .team-item:hover { background: var(--amber-soft); }
    .member-avatar {
      position: relative; width: 38px; height: 38px; border-radius: 50%;
      background: var(--paper-deep); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--font-display); font-size: 14px; font-weight: 600; color: var(--green-bright); flex-shrink: 0;
    }
    .online-dot { position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--card); }
    .dot-active { background: var(--green-bright); }
    .dot-away { background: var(--amber); }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .member-role { font-size: 11.5px; color: var(--ink-faintest); margin-top: 1px; font-family: var(--font-body); }
    .member-projects { text-align: center; flex-shrink: 0; }
    .proj-count { display: block; font-family:var(--font-display); font-size: 16px; color: var(--green-bright); }
    .proj-label { display: block; font-family:var(--font-mono); font-size: 9px; color: var(--ink-faintest); text-transform:uppercase; }

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  // ─── USER SESSION ───
  function getCurrentUser() {
    try {
      const raw = localStorage.getItem('user');
      const isAuthenticated = localStorage.getItem('isAuthenticated') === 'true';
      if (!raw || !isAuthenticated) return null;
      return JSON.parse(raw);
    } catch { return null; }
  }
  function usernameFromEmail(email) { if (!email) return ''; return email.includes('@') ? email.split('@')[0] : email; }
  function getInitial(email) { if (!email) return '?'; return email.charAt(0).toUpperCase(); }

  const currentUser = getCurrentUser();
  const currentEmail = currentUser?.email || '';
  const currentUsername = usernameFromEmail(currentEmail);
  const currentInitial = getInitial(currentEmail);

  function paintUserChrome() {
    const nameToShow = currentUsername || currentEmail || 'Signed out';
    const displayEmail = currentEmail || 'No account signed in';
    document.getElementById('sidebar-user-avatar').textContent = currentInitial;
    document.getElementById('sidebar-user-name').textContent = nameToShow;
    document.getElementById('sidebar-user-email').textContent = displayEmail;
    document.getElementById('topbar-user-avatar').textContent = currentInitial;
    document.getElementById('topbar-user-name').textContent = nameToShow;
    document.getElementById('topbar-user-email').textContent = displayEmail;
  }
  function logout() {
    localStorage.removeItem('user');
    localStorage.removeItem('isAuthenticated');

    window.location.href = 'login.html';

  const certificateApprovals = [

    { rider: "Aditya Verma", track: "Product Design Sprint — UX Elective", status: "Awaiting Final Review", date: "Est. Sep 2026" },

  const scheduleEvents = [

    { date: "Sep 22", event: "Capstone panel — sit as evaluator", site: trackTypeName.fullstack, type: "urgent" }
  ];

  const liveFeed = [
    { icon: "fa-inbox", text: "Ananya Kulkarni submitted the Week 6 checkpoint for review", time: "4h ago" },
    { icon: "fa-file-pen", text: "Sneha Pillai's capstone brief is awaiting your feedback", time: "1d ago" },

    { icon: "fa-file-invoice-dollar", text: "August office-hours compensation was paid out", time: "5d ago" }
  ];

  const navItemsList = [
    { icon: "fa-gauge-high", label: "Faculty Dashboard", id: "dashboard" },
    { icon: "fa-user-group", label: "My Riders", id: "riders" },
    { icon: "fa-inbox", label: "Review Queue", id: "review" },
    { icon: "fa-graduation-cap", label: "Certificates", id: "certificates" },
    { icon: "fa-calendar-days", label: "Schedule", id: "schedule" },

  const pageMap = {
    dashboard:    { title: "Faculty Dashboard", sub: "An overview of your riders, review queue and schedule" },
    riders:       { title: "My Riders", sub: "Every rider currently assigned to your mentorship" },

  let state = {
    activeNav: (function () {
      const saved = localStorage.getItem('facultyActiveNav');
      return saved && pageMap[saved] ? saved : "dashboard";
    })(),
    settings: { notifications: true, emailDigest: true, darkMode: false, language: "English" }

  function fmt(n) { return "₹" + n.toLocaleString("en-IN"); }
  function go404() { window.location.href = "404.html"; }

  function regionTag(facility, labelMap) {
    const c = trackTypeAccents[facility] || "#FF7A59";
    const label = labelMap ? labelMap[facility] : facility;
    return `<span class="region-tag" style="color:${c};border-color:${c};background:${c}1F;">${label}</span>`;
  }

  function initials(name) { return name.split(" ").map(p => p.charAt(0)).join(""); }

  function animateStatBars() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.stat-bar-fill, .progress-fill').forEach(el => {
        const target = el.getAttribute('data-w');
        if (target) el.style.width = target + '%';
      });
      const donut = document.querySelector('.donut-svg');
      if (donut) donut.classList.add('drawn');
    });
  }

  function initAOS() {
    AOS.init({ duration: 600, once: true, offset: 20, easing: 'ease-out-cubic', disable: window.innerWidth < 768 });
  }

  // ─── RENDER FUNCTIONS ───
  function renderDashboard() {
    const activeRiders = riders.filter(r => r.status !== "Completed").length;
    const needsReview = reviewQueue.filter(d => d.status === "Needs Review").length;
    const atRisk = riders.filter(r => r.status === "At Risk").length;
    const nextEvent = scheduleEvents[0];

    const stats = [
      { icon: "fa-user-group", delta: riders.length + " total", value: String(activeRiders), label: "Active Riders", bar: Math.round((activeRiders / riders.length) * 100), accent: true },
      { icon: "fa-inbox", delta: "Awaiting feedback", value: String(needsReview), label: "In Review Queue", bar: 70, warn: needsReview > 0 },
      { icon: "fa-triangle-exclamation", delta: atRisk > 0 ? "Needs attention" : "All on track", value: String(atRisk), label: "Riders At Risk", bar: 45, warn: atRisk > 0 },
      { icon: "fa-calendar-days", delta: nextEvent.date, value: nextEvent.event.length > 22 ? nextEvent.event.slice(0, 20) + "…" : nextEvent.event, label: "Next On Calendar", bar: 40 }
    ];

    const statsHtml = stats.map((s, i) =>
      `<div class="stat-card ${s.accent ? "stat-accent" : ""}" data-aos="fade-up" data-aos-delay="${i * 60}" onclick="go404()">
        <div class="stat-top"><i class="fa-solid ${s.icon} stat-icon"></i><span class="stat-delta ${s.warn ? "warn" : "up"}">${s.delta}</span></div>
        <div class="stat-value" style="font-size:${s.label === 'Next On Calendar' ? '19px' : '28px'}">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div>
      </div>`
    ).join("");

    const rows = riders.map(r => {
      return `<tr onclick="go404()">
        <td><div class="t-name">${r.name}</div><div class="t-sub">Cohort ${r.cohort}</div></td>
        <td>${regionTag(r.track, trackTypeName)}</td>
        <td><span class="status-badge ${riderStatusColor[r.status]}">${r.status}</span></td>
        <td><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" data-w="${r.progress}"></div></div><span class="progress-pct">${r.progress}%</span></div></td>
        <td class="date-col">${r.lastSubmission}</td>
        <td class="date-col">${r.lastDate}</td>
      </tr>`;
    }).join("");

    const feedHtml = liveFeed.map(a =>
      `<li class="activity-item" onclick="go404()">
        <i class="fa-solid ${a.icon} act-icon"></i>
        <div class="act-body"><p class="act-text">${a.text}</p><span class="act-time">${a.time}</span></div>
      </li>`
    ).join("");

    const actionItems = reviewQueue.filter(d => d.status === "Needs Review").slice(0, 5).map(d =>
      `<li class="team-item" onclick="go404()">
        <div class="member-avatar" style="background:${urgencyBg[d.urgency]};color:${urgencyColor[d.urgency]}">${d.type.charAt(0)}</div>
        <div class="member-info"><div class="member-name">${d.title}</div><div class="member-role">${d.rider} · ${d.track}</div></div>
        <div class="member-projects"><span class="proj-count" style="font-size:13px;color:${urgencyColor[d.urgency]}">${d.submitted}</span><span class="proj-label">${d.urgency}</span></div>
      </li>`
    ).join("");

    const upcomingMs = scheduleEvents.slice(0, 5).map(ev => {
      const c2 = scheduleTypeColor[ev.type];
      const parts = ev.date.split(" ");
      return `<li class="milestone-item" onclick="go404()">
        <div class="ms-date"><span>${parts[0]}</span><span style="font-size:18px;font-family:var(--font-display)">${parts[1]}</span></div>
        <div class="ms-line"><div class="ms-dot" style="background:${c2}"></div></div>
        <div class="ms-body"><div class="ms-event">${ev.event}</div><div class="ms-project">${ev.site}</div></div>
        <span class="ms-tag" style="background:${c2}1F;color:${c2}">${ev.type}</span>
      </li>`;
    }).join("");

    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    animateStatBars();
    initAOS();
  }

  function navigateTo(id) {
    state.activeNav = id;
    localStorage.setItem('facultyActiveNav', id);
    closeSidebar();
    closeTopbarUserMenu();
    renderPage();
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("sidebar-open");
    document.getElementById("sidebar-overlay").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("sidebar-open");
    document.getElementById("sidebar-overlay").classList.remove("show");
  }
  function closeTopbarUserMenu() {
    document.getElementById("topbar-user").classList.remove("open");
  }

  // ─── EVENT BINDING ───
  document.getElementById("hamburger-btn").addEventListener("click", openSidebar);
  document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
  document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);
  document.getElementById("notif-btn").addEventListener("click", go404);
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-user-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    document.getElementById("topbar-user").classList.toggle("open");
  });
  document.addEventListener("click", closeTopbarUserMenu);

  document.addEventListener("click", function(e) {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
        const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const key = toggle.getAttribute("data-toggle");
      state.settings[key] = !state.settings[key];
      const on = state.settings[key];
      toggle.style.background = on ? "#FF7A59" : "rgba(255,122,89,0.16)";
      toggle.querySelector(".toggle-knob").style.left = on ? "20px" : "3px";
      return;
    }
  });

  document.addEventListener("change", function(e) {
    if (e.target && e.target.id === "lang-select") {
      state.settings.language = e.target.value;
    }
  });

  // ─── INIT ───
  paintUserChrome();
  renderPage();
</script>
</body>
</html>
